<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crypto.M</title>
<meta name="description" content="Crypto.M — spot early crypto movers with the Early Score and practise with paper money.">
<meta name="theme-color" content="#0B0E11">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="brand" href="#radar"><span class="mark" aria-hidden="true"><img data-icon="engineerHead" alt="" hidden></span><span class="brand-name">Crypto.M</span></a>
    <p class="side-tag" data-t="app.tag"></p>
    <nav class="side-nav" aria-label="Main">
      <a href="#radar" data-nav="radar"><img class="ico3d" data-icon="radar" alt="" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12l6-6"/></svg><span data-t="nav.radar"></span></a>
      <a href="#allin" data-nav="allin"><img class="ico3d" data-icon="stack" alt="" hidden><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v5c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 11v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/></svg><span data-t="nav.allin"></span></a>
      <a href="#markets" data-nav="markets"><img class="ico3d" data-icon="markets" alt="" hidden><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg><span data-t="nav.markets"></span></a>
      <a href="#portfolio" data-nav="portfolio"><img class="ico3d" data-icon="wallet" alt="" hidden><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M8 6V4h8v2M3 12h18"/></svg><span data-t="nav.portfolio"></span></a>
      <a href="#record" data-nav="record"><img class="ico3d" data-icon="trophy" alt="" hidden><svg viewBox="0 0 24 24"><path d="M4 20l5-6 4 3 7-9"/><path d="M15 8h5v5"/></svg><span data-t="nav.record"></span></a>
    </nav>
    <div class="side-foot">
      <button class="status" data-status type="button"></button>
      <div class="side-row"><div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="zh">中</button></div>
      <button class="acct" data-acct type="button"></button></div>
    </div>
  </aside>

  <header class="top">
    <a class="brand" href="#radar"><span class="mark" aria-hidden="true"><img data-icon="engineerHead" alt="" hidden></span><span class="brand-name">Crypto.M</span></a>
    <button class="status" data-status type="button"></button>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="zh">中</button></div>
    <button class="acct" data-acct type="button"></button>
  </header>

  <main class="main">
    <!-- Radar -->
    <section class="page" data-page="radar">
      <div class="hero">
        <div class="hero-head">
          <div class="hero-txt"><h1 data-t="radar.title"></h1>
          <p class="hero-meta" id="heroMeta"></p></div>
          <div class="hero-mascot" id="heroMascot" aria-hidden="true"></div>
        </div>
        <div class="podium" id="podium"></div>
        <div class="podium-labels" id="podiumLabels"></div>
        <p class="bt-line" id="btLine"></p>
      </div>
      <div class="filters" role="tablist" id="radarFilters">
        <button type="button" data-f="early"><span data-t="f.early"></span><b data-count="early"></b></button>
        <button type="button" data-f="build"><span data-t="f.build"></span><b data-count="build"></b></button>
        <button type="button" data-f="late"><span data-t="f.late"></span><b data-count="late"></b></button>
        <button type="button" data-f="all"><span data-t="f.all"></span><b data-count="all"></b></button>
      </div>
      <ul class="list" id="radarList"></ul>
    </section>

    <!-- All-in -->
    <section class="page" data-page="allin" hidden>
      <div class="page-head"><h1 data-t="ai.title"></h1><p class="muted" data-t="ai.sub"></p></div>
      <div class="seg" id="aiStart" role="group">
        <button type="button" data-ai-start="100">$100</button><button type="button" data-ai-start="1000">$1,000</button><button type="button" data-ai-start="10000">$10,000</button>
      </div>
      <div class="ai-hero" id="aiHero"></div>
      <div class="ai-chart" id="aiChart"></div>
      <div id="aiCompare"></div>
      <h2 data-t="ai.now"></h2>
      <div id="aiNow"></div>
      <p class="note warn" data-t="ai.warn"></p>
      <h2 data-t="ai.list"></h2>
      <div id="aiTrades"></div>
    </section>

    <!-- Markets -->
    <section class="page" data-page="markets" hidden>
      <div class="page-head">
        <h1 data-t="nav.markets"></h1>
        <div class="tools">
          <input id="mSearch" type="search" autocomplete="off" spellcheck="false" data-tph="m.search">
          <div class="seg" id="mSort" role="group">
            <button type="button" data-sort="score" data-t="m.sScore"></button>
            <button type="button" data-sort="change" data-t="m.sChange"></button>
            <button type="button" data-sort="vol" data-t="m.sVol"></button>
          </div>
        </div>
      </div>
      <ul class="list" id="marketList"></ul>
    </section>

    <!-- Portfolio -->
    <section class="page" data-page="portfolio" hidden>
      <div class="page-head"><h1 data-t="nav.portfolio"></h1><p class="muted" id="pfWho"></p></div>
      <div class="summary" id="pfSummary"></div>
      <h2 data-t="p.open"></h2>
      <div id="pfOpen"></div>
      <h2 data-t="p.history"></h2>
      <div id="pfHist"></div>
      <div class="reset-row">
        <div class="seg" id="pfCap" role="group">
          <button type="button" data-cap="1000">$1k</button><button type="button" data-cap="5000">$5k</button>
          <button type="button" data-cap="10000">$10k</button><button type="button" data-cap="50000">$50k</button>
        </div>
        <button type="button" class="btn ghost" id="pfReset" data-t="p.reset"></button>
      </div>
    </section>

    <!-- Track record -->
    <section class="page" data-page="record" hidden>
      <div class="page-head"><h1 data-t="r.title"></h1><p class="muted" data-t="r.sub"></p></div>
      <div class="summary" id="btStats"></div>
      <p class="verdict" id="btVerdict"></p>
      <div class="bt-chart" id="btChart"></div>
      <h2 data-t="f2.title"></h2>
      <p class="muted" data-t="f2.note"></p>
      <div id="followDays"></div>
      <h2 data-t="r.log"></h2>
      <p class="muted" data-t="r.logSub"></p>
      <div id="sigLog"></div>
      <details class="how"><summary data-t="r.how"></summary><p data-t="r.howText"></p></details>
    </section>

    <p class="foot" data-t="foot"></p>
  </main>

  <aside class="detail" id="detailDesk" aria-live="polite"></aside>

  <nav class="bottom" aria-label="Main">
    <a href="#radar" data-nav="radar"><img class="ico3d" data-icon="radar" alt="" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12l6-6"/></svg><span data-t="nav.radar"></span></a>
      <a href="#allin" data-nav="allin"><img class="ico3d" data-icon="stack" alt="" hidden><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v5c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 11v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/></svg><span data-t="nav.allin"></span></a>
    <a href="#markets" data-nav="markets"><img class="ico3d" data-icon="markets" alt="" hidden><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg><span data-t="nav.markets"></span></a>
    <a href="#portfolio" data-nav="portfolio"><img class="ico3d" data-icon="wallet" alt="" hidden><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M8 6V4h8v2M3 12h18"/></svg><span data-t="nav.portfolio"></span></a>
    <a href="#record" data-nav="record"><img class="ico3d" data-icon="trophy" alt="" hidden><svg viewBox="0 0 24 24"><path d="M4 20l5-6 4 3 7-9"/><path d="M15 8h5v5"/></svg><span data-t="nav.record"></span></a>
  </nav>
</div>

<dialog class="sheet" id="detailSheet" aria-label="Coin">
  <button type="button" class="x" data-close aria-label="Close">✕</button>
  <div id="detailMobile"></div>
</dialog>

<dialog class="sheet small" id="authDlg">
  <form id="authForm" novalidate>
    <button type="button" class="x" data-close aria-label="Close">✕</button>
    <img class="mascot-img auth-mascot" data-icon="engineer" alt="" hidden>
    <h2 id="authTitle"></h2>
    <label for="authId" data-t="auth.id"></label>
    <input id="authId" name="username" type="text" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" data-tph="auth.idPh">
    <label for="authPass" data-t="auth.pass"></label>
    <input id="authPass" name="password" type="password" autocomplete="current-password" data-tph="auth.passPh">
    <p class="err" id="authErr" role="alert" hidden></p>
    <button type="submit" class="btn primary wide" id="authGo"></button>
    <button type="button" class="link" id="authSwitch"></button>
    <p class="muted small-note" data-t="auth.note"></p>
  </form>
</dialog>

<dialog class="sheet small" id="askDlg">
  <p id="askMsg" class="ask-msg"></p>
  <div class="ask-go"><button type="button" class="btn ghost" id="askNo"></button><button type="button" class="btn primary" id="askOk"></button></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
<script src="js/i18n.js" defer></script>
<script src="js/strategy.js" defer></script>
<script src="js/data.js" defer></script>
<script src="js/coin3d.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
