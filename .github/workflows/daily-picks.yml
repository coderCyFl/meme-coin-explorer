# AI 揀幣 daily batch → data/picks.json (append). Runs EVERY day incl. Sat/Sun.
# Binance public REST only (data-api.binance.vision). No X / no secrets / no AI API.
# One batch per Asia/Shanghai day: the script itself skips (exit 0, no writes) unless --force.
# Commits ONLY data/picks.json; aborts if the generator touched any other tracked file.
name: Daily AI picks batch
on:
  schedule:
    # GitHub often delays/drops schedules (2026-10-30: all 5 morning slots missed until
    # manual workflow_dispatch). Mirror gainer-board seal pattern: primary + near backups
    # + late catch-ups + dense hourly catch-up. Script same-day check → exit 0 no-op if
    # today's batch already exists. Asia/Shanghai = UTC+8 (times in comments are HKT).
    # Primary 08:47
    - cron: "47 0 * * *"
    # Near backups (like seal 55→58)
    - cron: "23 1 * * *"   # 09:23
    - cron: "13 2 * * *"   # 10:13
    - cron: "43 3 * * *"   # 11:43
    - cron: "17 6 * * *"   # 14:17
    # Late catch-ups (like seal 40 16) — afternoon/evening HKT
    - cron: "37 8 * * *"   # 16:37
    - cron: "11 10 * * *"  # 18:11
    - cron: "29 12 * * *"  # 20:29
    # Dense hourly catch-up :07 UTC hours 0–12 (= 08:07–20:07 HKT) — mirrors
    # gainer-board's every-15-min seal_due. Overlaps with the slots above are intentional no-ops.
    - cron: "7 0-12 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Write a batch even if one already exists for today (HK date)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # dispatch the Pages deploy (pushes by GITHUB_TOKEN don't trigger on:push)

concurrency:
  group: daily-picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate batch (script skips with exit 0 if today's Asia/Shanghai batch exists)
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then node scripts/make_bn_setup_picks.mjs --force; else node scripts/make_bn_setup_picks.mjs; fi
      - name: Commit + push (picks.json only, rebase retry)
        id: push
        run: |
          OTHER=$(git status --porcelain --untracked-files=all | grep -v ' data/picks.json$' || true)
          if [ -n "$OTHER" ]; then echo "::error::generator changed files other than data/picks.json:"; echo "$OTHER"; exit 1; fi
          if git diff --quiet -- data/picks.json; then echo "picks.json unchanged (skipped) — nothing to commit"; echo "changed=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          node -e 'const d=require("./data/picks.json");const b=d.batches.at(-1);const buys=b.entries.filter(e=>e.type==="buy");
            const bad=buys.filter(e=>!(e.target_price_usd>0&&e.stop_price_usd>0&&e.review_at&&e.sell_by));
            console.log(b.id,b.created_at,"regime",b.regime&&b.regime.state,"buys",buys.length);
            if(bad.length){console.error("missing exit fields:",bad.map(e=>e.id).join(","));process.exit(1)}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/picks.json
          if git diff --staged --quiet; then echo "changed=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -n "$(git diff --staged --name-only | grep -v '^data/picks.json$')" ]; then echo "::error::staged non-picks file"; exit 1; fi
          git commit -m "chore(picks): daily batch $(TZ=Asia/Shanghai date +%F) [skip ci]"
          ok=0
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i*5))
          done
          [ "$ok" = "1" ] || { echo "::error::push failed after retries"; exit 1; }
          echo "changed=1" >> "$GITHUB_OUTPUT"
      - name: Deploy Pages
        if: steps.push.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main || echo "pages dispatch failed (non-fatal)"
