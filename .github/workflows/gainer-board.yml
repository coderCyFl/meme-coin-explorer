# 急升榜: 15-min snapshot (🔥 pump / ⚡ early) + 4h/24h outcome seal, daily 23:55 HKT scorecard vs
# Binance top-20 gainers. Binance public REST only (data-api.binance.vision first). No X / no secrets / no AI.
name: Gainer board snapshot + seal
on:
  schedule:
    # Snapshot: primary 15-min + offset backup 15-min (2026-10-30 primary stalled ~09:22–13:06 HKT).
    # Seal: primary 23:55 + near backup 23:58 + late catch-up 00:40; every snapshot also seal_due().
    - cron: "5,20,35,50 * * * *"   # primary 15-min snapshot (denser early flags)
    - cron: "10,25,40,55 * * * *"  # offset backup 15-min (when primary slots drop for hours)
    - cron: "55 15 * * *"   # 23:55 Asia/Shanghai daily seal (GH cron is UTC: 15:55Z = 23:55 UTC+8)
    - cron: "58 15 * * *"   # 23:58 backup seal (no-op if already sealed)
    - cron: "40 16 * * *"   # 00:40 catch-up seal (GH often delays crons by hours; every 15-min run also catches up)
  workflow_dispatch:
    inputs:
      cmd:
        description: "hourly | scorecard | summary"
        default: "hourly"

permissions:
  contents: write
  actions: write   # dispatch the Pages deploy (pushes by GITHUB_TOKEN don't trigger on:push)

concurrency:
  group: gainer-board
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run
        env:
          SCHED: ${{ github.event.schedule }}
          CMD: ${{ github.event.inputs.cmd }}
        run: |
          case "$SCHED" in
            "55 15 * * *"|"58 15 * * *"|"40 16 * * *") C=scorecard ;;   # seals every due unsealed day (deterministic, write-once)
            *) C=${CMD:-hourly} ;;                                      # hourly also runs seal_due() catch-up
          esac
          echo "cmd=$C"
          python3 scripts/gainer_board.py "$C"
      - name: Commit + push (rebase retry)
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gainer_board
          if git diff --staged --quiet; then echo "changed=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 scripts/check_seals.py --base HEAD   # never modify a sealed daily_vs_gainers file
          git commit -m "chore(gainer-board): snapshot/seal $(date -u +%FT%H:%MZ) [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin main || { git rebase --abort 2>/dev/null; sleep $((i*5)); continue; }
            python3 scripts/check_seals.py --base origin/main || exit 1   # rebase must not clobber a seal
            git push && break
            sleep $((i*5))
          done
          echo "changed=1" >> "$GITHUB_OUTPUT"
      - name: Deploy Pages
        if: steps.push.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main || echo "pages dispatch failed (non-fatal)"
